submission:
  title: "ForensiTriage — AI-Assisted Crime Scene Evidence Prioritization"   # REQUIRED

  problem_statement: >                        # REQUIRED — 1-3 sentences. What problem? Who has it?
    Forensic investigators handling complex crime scenes are overwhelmed by
    large volumes of heterogeneous evidence items and must manually decide
    examination order under time pressure, risking degradation of perishable
    biological or trace evidence before it can be processed.

  solution_summary: >                         # REQUIRED — 1-3 sentences. What did you build?
    ForensiTriage is a browser-based decision-support prototype that lets
    forensic investigators create cases, log evidence items, and instantly
    receive explainable examination priorities generated by a transparent
    rule-based scoring engine — along with recommended examination types, a
    proposed schedule, and a printable case report. All logic runs locally in
    the browser with no server or paid API required.

  key_features:                               # REQUIRED — List 3 to 5 specific features you implemented
    - "Rule-based explainable prioritization engine scoring evidence on degradation, contamination, urgency and forensic value — classifying each item as Critical, High or Routine with full factor breakdowns"
    - "Full evidence CRUD with 7 evidence categories (biological, digital, fingerprint, trace, physical, document, other), search, and multi-field filtering"
    - "Manual priority override with mandatory reason capture, audit trail preserved in report"
    - "Proposed examination schedule ranked by priority with per-item examination type recommendations"
    - "Printable PDF-ready case report including evidence inventory, priority analysis, schedule, overrides, and forensic disclaimers"

  tech_stack:
    languages: ["HTML5", "CSS3", "JavaScript (ES6+)"]
    frameworks: []
    ibm_technologies: ["IBM Bob (AI coding assistant used during development)"]
    databases: ["Browser localStorage (client-side demo persistence)"]
    other: ["No build tools or dependencies — runs directly in any modern browser"]

  what_we_are_most_proud_of: >                # Optional but recommended
    The explainable rule-based prioritization engine. Every score is broken
    down into four named factors (degradation, contamination, urgency, evidence
    value) so investigators can understand and challenge every recommendation.
    The manual override system with mandatory reason capture reflects real
    forensic workflow where expert judgement always takes precedence over
    automated suggestions.

  known_limitations: >                        # Optional but recommended
    Uses browser localStorage — not suitable for real confidential forensic
    data. Rule weights are prototype constants, not validated against real
    forensic caseload data. No authentication or multi-user support. No server
    or backend; data is lost if localStorage is cleared. Tested primarily in
    Chrome/Edge; minor cosmetic differences possible in Firefox. Video and live
    demo links are pending post-submission recording.

